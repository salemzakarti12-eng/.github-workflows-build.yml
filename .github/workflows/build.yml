name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Permanent Keystore & Configure Release Signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > my-upload-key.jks
          cp my-upload-key.jks app/my-upload-key.jks
          python3 -c '
          import os, re
          pw = os.environ["KEY_PASSWORD"]
          with open("app/build.gradle.kts", "r") as f:
              text = f.read()
          text = re.sub(r"storePassword\s*=\s*.*", f"storePassword = \"{pw}\"", text)
          text = re.sub(r"keyPassword\s*=\s*.*", f"keyPassword = \"{pw}\"", text)
          text = re.sub(r"keyAlias\s*=\s*.*", "keyAlias = \"hypnostream\"", text)
          with open("app/build.gradle.kts", "w") as f:
              f.write(text)
          '

      - name: Auto-Configure Sony TV Compatibility
        run: |
          sed -i 's/minSdk = [0-9]*/minSdk = 24/g' app/build.gradle.kts
          RUN_NUM=${{ github.run_number }}
          sed -i "s/versionCode = [0-9]*/versionCode = $RUN_NUM/g" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.$RUN_NUM\"/g" app/build.gradle.kts

      - name: Generate 4K Anti-Aliased TV Banner PNG
        run: |
          pip install pillow
          python3 scripts/generate_tv_banner.py

      - name: Build Release APK Using Gradle
        run: gradle assembleRelease

      - name: Copy Signed Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "HypnoStream-v1.${{ github.run_number }}.apk"

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: HypnoStream v1.${{ github.run_number }}
          files: HypnoStream-v1.${{ github.run_number }}.apk
