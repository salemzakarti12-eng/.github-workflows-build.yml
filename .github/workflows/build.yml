name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        run: |
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Generate Missing Keystore and Config
        run: |
          echo "Generating debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true

          echo "Generating dummy google-services.json if missing..."
          PKG_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts || grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "com.example.iptv")
          if [ ! -f "app/google-services.json" ]; then
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "mock-iptv-project",
              "storage_bucket": "mock-iptv-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuild1234567890"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build APK Using Gradle 9.3.1
        run: |
          echo "Downloading Gradle 9.3.1..."
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$PWD/gradle-9.3.1/bin:$PATH
          
          echo "Accepting Android SDK Licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          
          echo "Building Debug APK..."
          gradle assembleDebug --stacktrace

      - name: Upload APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          gh release create "build-${{ github.run_number }}" "$APK_FILE" --title "APK Build #${{ github.run_number }}" --notes "Ready to install Android APK"
