name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        run: |
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Auto-Configure Sony TV Compatibility & Sharp TV Banner
        run: |
          echo "Setting minSdk = 24 (Android 7.0+) for older Sony Android TVs & modern libraries..."
          sed -i 's/minSdk = [0-9]*/minSdk = 24/g' app/build.gradle.kts || true
          sed -i 's/minSdkVersion([0-9]*)/minSdkVersion(24)/g' app/build.gradle.kts || true

          echo "Generating debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true

          echo "Generating dummy google-services.json if missing..."
          PKG_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts || grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "com.example")
          if [ ! -f "app/google-services.json" ]; then
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "mock-iptv-project",
              "storage_bucket": "mock-iptv-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuild1234567890"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          echo "Generating Sharp 1280x720 HD Android TV Banner PNG..."
          find app/src/main/res -name "ic_banner.*" -delete || true
          mkdir -p app/src/main/res/drawable-xhdpi

          cat << 'EOF' > GenerateBanner.java
          import java.awt.*;
          import java.awt.geom.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public class GenerateBanner {
              public static void main(String[] args) throws Exception {
                  int w = 1280, h = 720;
                  BufferedImage img = new BufferedImage(w, h, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = img.createGraphics();
                  g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                  g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_ON);
                  g.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY);
                  g.setRenderingHint(RenderingHints.KEY_STROKE_CONTROL, RenderingHints.VALUE_STROKE_PURE);

                  GradientPaint bg = new GradientPaint(0, 0, new Color(4, 12, 28), w, h, new Color(2, 6, 15));
                  g.setPaint(bg);
                  g.fillRect(0, 0, w, h);

                  RadialGradientPaint glow = new RadialGradientPaint(
                      new Point2D.Float(340, 360), 420f,
                      new float[]{0f, 0.55f, 1f},
                      new Color[]{new Color(0, 229, 255, 55), new Color(29, 78, 216, 25), new Color(0, 0, 0, 0)}
                  );
                  g.setPaint(glow);
                  g.fillRect(0, 0, w, h);

                  float cx = 270f, cy = 350f;

                  AffineTransform old = g.getTransform();
                  g.rotate(Math.toRadians(-16), cx, cy);
                  g.setStroke(new BasicStroke(16f, BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));
                  g.setColor(new Color(2, 132, 199, 180));
                  g.draw(new Arc2D.Float(cx - 210f, cy - 82f, 420f, 164f, 0f, 180f, Arc2D.OPEN));
                  g.setTransform(old);

                  float tvW = 260f, tvH = 190f;
                  float tvX = cx - tvW / 2f, tvY = cy - tvH / 2f - 12f;
                  RoundRectangle2D tvRect = new RoundRectangle2D.Float(tvX, tvY, tvW, tvH, 42f, 42f);
                  g.setColor(new Color(3, 9, 23));
                  g.fill(tvRect);

                  GradientPaint borderGrad = new GradientPaint(tvX, tvY, new Color(0, 229, 255), tvX + tvW, tvY + tvH, new Color(41, 121, 255));
                  g.setPaint(borderGrad);
                  g.setStroke(new BasicStroke(15f, BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));
                  g.draw(tvRect);

                  float barY = tvY + 36f;
                  g.setStroke(new BasicStroke(14f, BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));
                  g.setColor(new Color(255, 42, 84));
                  g.draw(new Line2D.Float(tvX + 34f, barY, tvX + 86f, barY));
                  g.setColor(new Color(139, 92, 246));
                  g.draw(new Line2D.Float(tvX + 104f, barY, tvX + 156f, barY));
                  g.setColor(new Color(0, 229, 255));
                  g.draw(new Line2D.Float(tvX + 174f, barY, tvX + 226f, barY));

                  Path2D play = new Path2D.Float();
                  float py = tvY + tvH * 0.58f;
                  play.moveTo(cx - 26f, py - 34f);
                  play.lineTo(cx - 26f, py + 34f);
                  play.lineTo(cx + 38f, py);
                  play.closePath();
                  g.setPaint(new GradientPaint(cx - 26f, py - 34f, Color.WHITE, cx + 38f, py + 34f, new Color(128, 216, 255)));
                  g.fill(play);

                  float standTop = tvY + tvH;
                  float standBot = standTop + 34f;
                  g.setColor(new Color(0, 210, 255));
                  g.setStroke(new BasicStroke(15f, BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));
                  g.draw(new Line2D.Float(cx, standTop, cx, standBot));
                  g.draw(new Line2D.Float(cx - 64f, standBot, cx + 64f, standBot));

                  g.rotate(Math.toRadians(-16), cx, cy);
                  GradientPaint ringGrad = new GradientPaint(cx - 210f, cy, new Color(0, 229, 255), cx + 210f, cy, new Color(124, 232, 255));
                  g.setPaint(ringGrad);
                  g.setStroke(new BasicStroke(20f, BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));
                  g.draw(new Arc2D.Float(cx - 210f, cy - 82f, 420f, 164f, 180f, 180f, Arc2D.OPEN));
                  g.setTransform(old);

                  Font titleFont = new Font("SansSerif", Font.BOLD, 104);
                  g.setFont(titleFont);
                  FontMetrics fm = g.getFontMetrics();
                  int textX = 525;
                  int textY = 365;

                  String part1 = "Hypno";
                  String part2 = "Stream";
                  g.setColor(Color.WHITE);
                  g.drawString(part1, textX, textY);

                  int part1Width = fm.stringWidth(part1);
                  GradientPaint textCyan = new GradientPaint(textX + part1Width, textY - 80, new Color(56, 189, 248), textX + part1Width + 360, textY, new Color(0, 229, 255));
                  g.setPaint(textCyan);
                  g.drawString(part2, textX + part1Width + 4, textY);

                  Font subFont = new Font("SansSerif", Font.PLAIN, 30);
                  g.setFont(subFont);
                  g.setColor(new Color(148, 163, 184));
                  g.drawString("4K LIVE TV  •  CINEMA VOD  •  SERIES", textX + 6, textY + 58);

                  GradientPaint lineGrad = new GradientPaint(textX, textY + 86, new Color(255, 42, 84), textX + 580, textY + 86, new Color(0, 229, 255));
                  g.setPaint(lineGrad);
                  g.setStroke(new BasicStroke(8f, BasicStroke.CAP_ROUND, BasicStroke.JOIN_ROUND));
                  g.draw(new Line2D.Float(textX + 6, textY + 88, textX + 620, textY + 88));

                  ImageIO.write(img, "PNG", new File("app/src/main/res/drawable-xhdpi/ic_banner.png"));
              }
          }
          EOF
          javac GenerateBanner.java
          java GenerateBanner
          rm -f GenerateBanner.java GenerateBanner.class

      - name: Build APK Using Gradle 9.3.1
        run: |
          echo "Downloading Gradle 9.3.1..."
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          export PATH=$PWD/gradle-9.3.1/bin:$PATH
          
          echo "Accepting Android SDK Licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          
          echo "Building Debug APK..."
          gradle assembleDebug --stacktrace

      - name: Upload APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          gh release create "build-${{ github.run_number }}" "$APK_FILE" --title "APK Build #${{ github.run_number }}" --notes "Ready to install Android APK"
