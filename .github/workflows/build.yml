name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Auto-Configure Sony TV Compatibility
        run: |
          sed -i 's/minSdk = [0-9]*/minSdk = 24/g' app/build.gradle.kts
          RUN_NUM=${{ github.run_number }}
          sed -i "s/versionCode = [0-9]*/versionCode = $RUN_NUM/g" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.$RUN_NUM\"/g" app/build.gradle.kts

      - name: Build APK Using Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with Permanent Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > hypnostream.jks
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_PATH" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks hypnostream.jks --ks-key-alias hypnostream --ks-pass "pass:$KEY_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "HypnoStream-v1.${{ github.run_number }}.apk" aligned.apk

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: HypnoStream v1.${{ github.run_number }}
          files: HypnoStream-v1.${{ github.run_number }}.apk
